[package]
name = "mindpal-chat"
version = "0.1.0"
description = "MindPal Chat — AI 伴侣跨平台应用"
authors = ["yehuoshun"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mindpal_chat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# 供 #[tokio::test] 跑网络集成测试
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# LLM 流式请求：rustls-tls-webpki-roots 纯 Rust TLS + 内置根证书，无系统依赖
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-webpki-roots"] }
# SSE 流逐块消费
futures-util = "0.3"
# 本地 SQLite：bundled 编译内置 sqlite3，无需系统库
rusqlite = { version = "0.32", features = ["bundled"] }
# 用户画像规则提取（纯 Rust，无系统依赖）
regex = "1"
# Edge TTS WebSocket 协议（wss 需要 TLS backend，tungstenite 默认不启用）
http = "1"
tokio-tungstenite = { version = "0.24", features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
# WS 握手 Sec-WebSocket-Key 编码
base64 = "0.22"

# 本地语音识别（桌面端；Android 交叉编译 whisper.cpp 留二期）
[target.'cfg(not(target_os = "android"))'.dependencies]
whisper-rs = { version = "0.16", default-features = false }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
