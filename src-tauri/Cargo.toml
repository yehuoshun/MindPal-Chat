[package]
name = "mindpal-chat"
version = "0.1.0"
description = "MindPal Chat — AI 伴侣跨平台应用"
authors = ["yehuoshun"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mindpal_chat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# LLM 流式请求：rustls-tls 避免依赖系统 OpenSSL，bytes_stream 需要 stream feature
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
# SSE 流逐块消费
futures-util = "0.3"
# 本地 SQLite：bundled 编译内置 sqlite3，无需系统库
rusqlite = { version = "0.32", features = ["bundled"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
