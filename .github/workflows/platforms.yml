name: Platforms

# 多端构建验证：桌面三端 release 产物 + iOS 工程初始化
# 触发：手动 + 每日定时（不进每次 push，避免拖慢反馈）
on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *" # 每日 UTC 18:00（北京时间 02:00）

jobs:
  linux:
    name: Linux build (deb)
    runs-on: ubuntu-latest
    env:
      WHISPER_DONT_GENERATE_BINDINGS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run tauri build -- --bundles deb
        timeout-minutes: 60
      - name: Report size
        run: |
          echo "=== deb ==="
          find src-tauri/target/release/bundle -name '*.deb' -exec du -h {} +
          echo "=== 可执行文件 ==="
          du -h src-tauri/target/release/mindpal-chat 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: mindpal-chat-linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  windows:
    name: Windows build (nsis)
    runs-on: windows-latest
    env:
      # Windows 需 bindgen 生成平台绑定，指向 runner 预装 LLVM 的 libclang
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run tauri build -- --bundles nsis
        timeout-minutes: 60
      - name: Report size
        shell: bash
        run: |
          echo "=== installer ==="
          find src-tauri/target/release/bundle -name '*.exe' -exec du -h {} +
          echo "=== exe ==="
          du -h src-tauri/target/release/mindpal-chat.exe 2>/dev/null || true
      - name: Smoke run (启动冒烟)
        shell: pwsh
        run: |
          $exe = "src-tauri/target/release/mindpal-chat.exe"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) {
            Write-Host "❌ 应用提前退出，退出码 $($p.ExitCode)"
            exit 1
          }
          Write-Host "✅ 应用启动后持续存活 12s（冒烟通过）"
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: mindpal-chat-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  macos:
    name: macOS build (dmg)
    runs-on: macos-latest
    env:
      # whisper.cpp 用 std::filesystem，需 10.15+
      MACOSX_DEPLOYMENT_TARGET: "10.15"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run tauri build -- --bundles dmg
        timeout-minutes: 60
      - name: Report size
        run: |
          echo "=== dmg / app ==="
          find src-tauri/target/release/bundle -name '*.dmg' -exec du -h {} +
          du -sh src-tauri/target/release/bundle/macos/*.app 2>/dev/null || true
      - name: Smoke run (启动冒烟)
        run: |
          set +e
          APP=$(find "src-tauri/target/release/bundle/macos" -maxdepth 4 -type f -path "*.app/Contents/MacOS/*" | head -1)
          echo "启动: $APP"
          "$APP" > smoke.log 2>&1 &
          PID=$!
          sleep 12
          if kill -0 "$PID" 2>/dev/null; then
            echo "✅ 应用启动后持续存活 12s（冒烟通过）"
            kill "$PID" 2>/dev/null
          else
            echo "❌ 应用提前退出，日志尾部："
            tail -40 smoke.log
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mindpal-chat-macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  ios-init:
    name: iOS project files (tauri ios init)
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate iOS project
        run: npm run tauri ios init
        timeout-minutes: 30
      - name: Commit generated files (if any)
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: iOS 工程生成（tauri ios init 自动提交）"
            git push
          else
            echo "no changes to commit"
          fi