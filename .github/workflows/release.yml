name: Release

# 发版流程：构建三端安装包（deb / nsis / dmg）并发布到 GitHub Releases
# 触发：
#   1) push tag `v*`（推荐，产物版本号自动取 tag，如 v0.2.0 → 0.2.0）
#   2) 手动 workflow_dispatch（version 留空则用仓库当前版本号）
# 注意：iOS 需要签名 + 开发者账号，无法出可安装包，不在此流程内

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "产物版本号（如 0.2.0；留空则 tag 取 v 后缀，手动触发取 tauri.conf.json 当前版本）"
        required: false
        default: ""

jobs:
  linux:
    name: Linux build (deb)
    runs-on: ubuntu-latest
    env:
      WHISPER_DONT_GENERATE_BINDINGS: "1"
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Resolve & sync version
        id: version
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            if [ "${{ github.ref_type }}" = "tag" ]; then
              VERSION="${GITHUB_REF_NAME#v}"
            else
              VERSION="$(jq -r .version src-tauri/tauri.conf.json)"
            fi
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "构建版本: $VERSION"
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          grep -n '"version"' src-tauri/tauri.conf.json
      - name: Build
        run: npm run tauri build -- --bundles deb
        timeout-minutes: 60
      - name: Report size
        run: |
          echo "=== deb ==="
          find src-tauri/target/release/bundle -name '*.deb' -exec du -h {} +
      - uses: actions/upload-artifact@v4
        with:
          name: mindpal-chat-linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  windows:
    name: Windows build (nsis)
    runs-on: windows-latest
    env:
      # Windows 需 bindgen 生成平台绑定，指向 runner 预装 LLVM 的 libclang
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Resolve & sync version
        id: version
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            if [ "${{ github.ref_type }}" = "tag" ]; then
              VERSION="${GITHUB_REF_NAME#v}"
            else
              VERSION="$(jq -r .version src-tauri/tauri.conf.json)"
            fi
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "构建版本: $VERSION"
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          grep -n '"version"' src-tauri/tauri.conf.json
      - name: Build
        run: npm run tauri build -- --bundles nsis
        timeout-minutes: 60
      - name: Report size
        shell: bash
        run: |
          echo "=== nsis / exe ==="
          find src-tauri/target/release/bundle -name '*.exe' -exec du -h {} +
      - uses: actions/upload-artifact@v4
        with:
          name: mindpal-chat-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  macos:
    name: macOS build (dmg)
    runs-on: macos-latest
    env:
      # whisper.cpp 用 std::filesystem，需 10.15+
      MACOSX_DEPLOYMENT_TARGET: "10.15"
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Resolve & sync version
        id: version
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            if [ "${{ github.ref_type }}" = "tag" ]; then
              VERSION="${GITHUB_REF_NAME#v}"
            else
              VERSION="$(jq -r .version src-tauri/tauri.conf.json)"
            fi
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "构建版本: $VERSION"
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          grep -n '"version"' src-tauri/tauri.conf.json
      - name: Build
        run: npm run tauri build -- --bundles dmg
        timeout-minutes: 60
      - name: Report size
        run: |
          echo "=== dmg / app ==="
          find src-tauri/target/release/bundle -name '*.dmg' -exec du -h {} +
      - uses: actions/upload-artifact@v4
        with:
          name: mindpal-chat-macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true
      - name: Build changelog (since last tag)
        id: changelog
        run: |
          prev="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -n "$prev" ]; then
            log="$(git log --oneline "$prev"..HEAD)"
          else
            log="$(git log --oneline -30 HEAD)"
          fi
          body="$(echo "$log" | sed 's/^/- /')"
          {
            echo "body<<EOF"
            echo "$body"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ steps.changelog.outputs.body }}
        shell: bash
        run: |
          ls -lh dist-artifacts/
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${{ needs.linux.outputs.version }}"
          fi
          printf '%s' "$NOTES" > release-notes.md
          gh release create "$TAG" dist-artifacts/* \
            --title "MindPal Chat $TAG" \
            --notes-file release-notes.md
